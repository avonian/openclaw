[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:neo4j]
command=/usr/local/bin/start-neo4j.sh
user=root
priority=10
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:graphiti]
command=/usr/local/bin/wait-for-neo4j.sh
user=node
priority=20
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openclaw-gateway]
command=node dist/index.js gateway --bind lan --port 18789
user=node
directory=/home/node/app
priority=30
autorestart=true
startsecs=5
environment=HOME="/home/node",TERM="xterm-256color"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:graphiti-sync]
command=bash /home/node/.openclaw/_shared/bin/graphiti-sync-loop.sh 300
user=node
priority=40
autorestart=true
startsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/home/node",GRAPHITI_URL="http://127.0.0.1:8000",OPENCLAW_CONFIG_DIR="/home/node/.openclaw"
